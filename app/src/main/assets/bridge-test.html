<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bridge Test</title>
<style>
  body {
    font-family: -apple-system, Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #111;
    color: #eee;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 12px 0;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  button {
    flex: 1;
    min-width: 100px;
    padding: 12px;
    font-size: 14px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #222;
    color: #eee;
  }
  button:active {
    background: #333;
  }
  #echoBtn {
    background: #1d4f30;
    border-color: #2e7d4f;
  }
  textarea {
    width: 100%;
    height: 50vh;
    box-sizing: border-box;
    background: #000;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px;
    resize: vertical;
  }
  .clear {
    margin-top: 8px;
    width: 100%;
  }
</style>
</head>
<body>

<h1>Bridge Test</h1>

<div class="row">
  <button id="btnA">Button A</button>
  <button id="btnB">Button B</button>
</div>

<div class="row">
  <button id="echoBtn">Call echo()</button>
</div>

<textarea id="log" readonly placeholder="Debug output will appear here..."></textarea>
<button class="clear" id="clearBtn">Clear log</button>

<script>
  const logEl = document.getElementById("log");

  function log(label, value) {
    const time = new Date().toLocaleTimeString();
    const text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
    logEl.value += `[${time}] ${label}\n${text}\n\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Placeholder buttons — intentionally do nothing yet
  document.getElementById("btnA").addEventListener("click", () => {
    log("btnA", "clicked (no-op)");
  });

  document.getElementById("btnB").addEventListener("click", () => {
    log("btnB", "clicked (no-op)");
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    logEl.value = "";
  });

  // Real bridge test: calls the "echo" callback registered in Dispatch.kt
  document.getElementById("echoBtn").addEventListener("click", async () => {
    const payload = { hello: "world", ts: Date.now() };
    log("echo() request", payload);

    if (!window.NativeBridge || typeof window.NativeBridge.call !== "function") {
      log("echo() error", "window.NativeBridge.call is not available — bridge.js may not have injected.");
      return;
    }

    try {
      const result = await window.NativeBridge.call("echo", payload);
      log("echo() resolved", result);
    } catch (err) {
      log("echo() rejected", err.message || String(err));
    }
  });

  // Surface anything bridge.js logs to console, in case console isn't visible (e.g. no USB debugging)
  window.addEventListener("error", (e) => {
    log("window error", e.message);
  });
</script>

</body>
</html>
